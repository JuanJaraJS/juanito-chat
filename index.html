<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat de Juan 🤖</title>
</head>
<body>
  <header>
    <h1>Bienvenido al Chat de Juan Jara</h1>
    <p>Puedes hacer preguntas sobre el documento cargado en Google Cloud.</p>
  </header>

  <button id="micButton">🎤</button>
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
        <df-messenger
            project-id="trabajoclasse"
            agent-id="c709783b-2e3c-46b3-bca7-07777308a292"
            language-code="es"
            max-query-length="-1">
        <df-messenger-chat-bubble
            chat-title="jaunito">
        </df-messenger-chat-bubble>
        </df-messenger>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
            text-align: center;
            padding-top: 80px;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        body:hover {
            background: linear-gradient(135deg, #1a1a1a, #333333);
        }

        h1 {
            color: #ff6f61;
            font-size: 3em;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        h1:hover {
            color: #ffca28;
            transform: scale(1.1);
        }

        p {
            font-size: 1.2em;
            color: #b0bec5;
            line-height: 1.6;
            max-width: 600px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
            transition: color 0.3s ease;
        }

        p:hover {
            color: #ff6f61;
        }

        df-messenger {
            z-index: 999;
            position: fixed;
            --df-messenger-font-color: #000;
            --df-messenger-font-family: Google Sans;
            --df-messenger-chat-background: #f3f6fc;
            --df-messenger-message-user-background: #d3e3fd;
            --df-messenger-message-bot-background: #fff;
            bottom: 16px;
            right: 16px;
        }


        /* Estilos para el botón del micrófono */
        #micButton {
            display: block; /* Oculto por defecto */
            position: fixed;
            bottom: 85px; 
            right: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ff6f61;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            transition: background-color 0.3s, transform 0.2s;
        }

        #micButton:hover {
            background-color: #ffca28;
            transform: scale(1.1);
        }
        
        #micButton.is-recording {
            background-color: #e53935;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
        }
    </style>


    <script>
        window.addEventListener('load', () => {
            console.log("Script de micrófono cargado ✅");
            const micButton = document.getElementById('micButton');
            const dfMessenger = document.querySelector('df-messenger');

            micButton.style.display = 'block'; // Mostrar siempre el botón para probar

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                micButton.addEventListener('click', () => {
                    try {
                        recognition.start();
                        micButton.classList.add('is-recording');
                        micButton.disabled = true;
                    } catch(e) {
                        console.error("Error al iniciar el micrófono:", e);
                    }
                });

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    console.log("Texto reconocido:", transcript);
                    dfMessenger.sendQuery(transcript);
                };

                recognition.onend = () => {
                    micButton.classList.remove('is-recording');
                    micButton.disabled = false;
                };

                recognition.onerror = (event) => {
                    console.error("Error en reconocimiento:", event.error);
                    micButton.classList.remove('is-recording');
                    micButton.disabled = false;
                    if(event.error === 'not-allowed') {
                        alert("Debes permitir el uso del micrófono 🔊");
                    }
                };
            } else {
                alert("Tu navegador no soporta reconocimiento de voz.");
                micButton.style.display = 'none';
            }
        });
</script>

</body>
</html>
